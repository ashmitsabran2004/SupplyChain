server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Vite's hashed JS/CSS chunks and Mapbox worker files must never fall through
  # to the SPA document. A missing chunk should be an actual 404, not HTML.
  location ~* ^/assets/.*\.(js|mjs)$ {
    try_files $uri =404;
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location ~* ^/assets/.*\.css$ {
    try_files $uri =404;
    default_type text/css;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
